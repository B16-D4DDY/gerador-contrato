<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerador de contrato de locação</title><style>*{box-sizing:border-box}
:root{--bg:#faf9f5;--card:#fff;--tx:#1f1e1d;--tx2:#5f5e5a;--bd:#d9d7cf;--ac:#185FA5;--acbg:#E6F1FB;--er:#A32D2D;--ok:#3B6D11}
@media(prefers-color-scheme:dark){:root{--bg:#1f1e1d;--card:#2a2928;--tx:#f1efe8;--tx2:#b4b2a9;--bd:#444441;--ac:#85B7EB;--acbg:#0C447C;--er:#F09595;--ok:#97C459}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:2rem 1rem 3rem}
h1{font-size:22px;font-weight:500;margin:0 0 4px}
.sub{font-size:14px;color:var(--tx2);margin:0 0 1.5rem}
#app{background:var(--card);border:.5px solid var(--bd);border-radius:12px;padding:1.5rem}
.bar{display:flex;gap:4px;margin:0 0 6px}.bar i{flex:1;height:4px;border-radius:2px;background:var(--bd)}.bar i.on{background:var(--ac)}
.cap{font-size:13px;color:var(--tx2);margin:0 0 1.25rem}
.q{font-size:18px;font-weight:500;margin:0 0 4px}.h{font-size:14px;color:var(--tx2);margin:0 0 1rem}
.row{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}.f label{font-size:13px;color:var(--tx2)}
input,select{width:100%;height:38px;padding:0 10px;font:inherit;font-size:15px;color:var(--tx);background:var(--card);border:.5px solid var(--bd);border-radius:8px}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px}
button{font:inherit;font-size:15px;height:38px;padding:0 16px;color:var(--tx);background:transparent;border:.5px solid var(--bd);border-radius:8px;cursor:pointer}
button:hover{border-color:var(--tx2)}button:active{transform:scale(.98)}
button.pri{background:var(--ac);border-color:var(--ac);color:var(--card)}
button.lnk{border:0;height:auto;padding:0 4px;font-size:13px;color:var(--ac);text-decoration:underline}
.err{font-size:13px;color:var(--er)}.ok{font-size:13px;color:var(--ok)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:1.25rem;gap:8px;flex-wrap:wrap}
.card{border:.5px solid var(--bd);border-radius:12px;padding:1rem 1.25rem}.card p{font-size:14px;line-height:1.7;margin:0 0 8px}.card p:last-child{margin:0}
.v{background:var(--acbg);color:var(--ac);padding:0 4px;border-radius:4px;font-weight:500}button.vb{height:auto;font:inherit;font-size:inherit;font-weight:500;border:0;text-align:left;cursor:pointer;display:inline;line-height:inherit;border-bottom:1px dashed var(--ac)}button.vb:hover{filter:brightness(.95)}.ed{border:.5px solid var(--ac);border-radius:8px;padding:12px 14px;margin:4px 0 12px}
.ext{font-size:14px;color:var(--tx2);min-height:22px;margin-top:8px}.sm{font-size:13px;color:var(--tx2);margin-top:8px}
.note{font-size:13px;color:var(--tx2);margin-top:1rem}</style></head>
<body><main><h1>Contrato de locação residencial</h1><p class="sub">Responda às perguntas e baixe o contrato em Word.</p><div id="app"></div><p class="note">O locador e as demais cláusulas seguem o modelo original. <button type="button" id="lockbtn" class="lnk">Bloquear</button></p></main>

fetch('https://viacep.com.br/ws/'+c+'/json/',{signal:ctl.signal}).then(function(r){return r.json();}).then(function(d){clearTimeout(tm);var st2=document.getElementById(p+'_cepst');if(!st2||s[p+'_cep'].replace(/\D/g,'')!==c)return;
if(d.erro){st2.className='err';st2.textContent='CEP não encontrado. Preencha o endereço manualmente.';return;}
var m={rua:d.logradouro,bairro:d.bairro,cidade:d.localidade,uf:d.uf};Object.keys(m).forEach(function(k){if(m[k]){s[p+'_'+k]=m[k];var el=document.getElementById(p+'_'+k);if(el){el.value=m[k];var er=el.parentNode.querySelector('.err');if(er)er.remove();delete errs[p+'_'+k];}}});
st2.className='ok';st2.textContent='Endereço encontrado. Informe o número e o complemento.';var nm=document.getElementById(p+'_num');if(nm)nm.focus();
}).catch(function(){clearTimeout(tm);var st3=document.getElementById(p+'_cepst');if(st3){st3.className='sm';st3.textContent='Sem conexão para buscar o CEP. Preencha o endereço manualmente.';}});}
function vAddr(p,e){if(s[p+'_rua'].trim().length<3)e[p+'_rua']='Informe a rua ou avenida';if(!s[p+'_num'].trim())e[p+'_num']='Informe o número';if(s[p+'_bairro'].trim().length<2)e[p+'_bairro']='Informe o bairro';if(s[p+'_cidade'].trim().length<2)e[p+'_cidade']='Informe a cidade';if(!/^[A-Za-z]{2}$/.test(s[p+'_uf'].trim()))e[p+'_uf']='Use 2 letras';if(s[p+'_cep'].replace(/\D/g,'').length!==8)e[p+'_cep']='CEP com 8 dígitos';}
function vDate(p,e){var d=+s[p+'_dia'],a=+s[p+'_ano'];if(!(d>=1&&d<=31))e[p+'_dia']='Dia de 1 a 31';if(s[p+'_mes']==='')e[p+'_mes']='Escolha o mês';if(!(a>=2020&&a<=2100))e[p+'_ano']='Ano inválido';}
var steps=[
{t:'Qual é o nome completo do(a) locatário(a)?',h:'Quem vai alugar o imóvel.',r:function(){return '<div class="row">'+fld('nome','Nome completo',1,'Maria da Silva Souza')+'</div>';},v:function(e){if(s.nome.trim().split(/\s+/).length<2)e.nome='Informe nome e sobrenome';}},
{t:'Qual é o CPF do(a) locatário(a)?',h:'Somente números',r:function(){return '<div class="row">'+fld('cpf','CPF',1,'000.000.000-00')+'</div><div class="sm" id="cpflive" style="min-height:22px"></div>';},v:function(e){if(!cpfOk(s.cpf))e.cpf='CPF inválido. Confira os números';}},
{t:'Onde o(a) locatário(a) mora hoje?',h:'Endereço atual, que vai na qualificação das partes.',r:function(){return addrFields('l');},v:function(e){vAddr('l',e);}},
{t:'Qual é o endereço do imóvel que será alugado?',h:'O imóvel objeto da cláusula 1.',r:function(){return '<div style="margin:0 0 12px"><button type="button" id="copy-addr">Usar o mesmo endereço do locatário</button></div>'+addrFields('i');},v:function(e){vAddr('i',e);}},
{t:'Quando começa a locação?',h:'O prazo de 12 meses conta a partir desta data.',r:function(){return '<div class="row">'+fld('ini_dia','Dia',1,'1','number')+sel('ini_mes','Mês',2,MESES)+fld('ini_ano','Ano',1,'2026','number')+'</div>';},v:function(e){vDate('ini',e);}},
{t:'Até que dia do mês o aluguel deve ser pago?',h:'O pagamento vence até esse dia do mês seguinte ao vencido.',r:function(){return '<div class="row">'+fld('venc','Dia do vencimento',1,'10','number')+'</div>';},v:function(e){var d=+s.venc;if(!(d>=1&&d<=31))e.venc='Dia de 1 a 31';}},
{t:'Qual é o valor mensal do aluguel?',h:'O valor por extenso é gerado automaticamente.',r:function(){return '<div class="row">'+fld('valor','Valor em reais',1,'650,00')+'</div><div class="ext" id="extout"></div>';},v:function(e){if(!moneyExt(s.valor))e.valor='Informe um valor válido, como 650,00';}},
{t:'Em que data o contrato será assinado?',h:'Já sugeri a data de hoje. Ajuste se precisar.',r:function(){return '<div class="row">'+fld('ass_dia','Dia',1,'6','number')+sel('ass_mes','Mês',2,MESES)+fld('ass_ano','Ano',1,'2026','number')+'</div>';},v:function(e){vDate('ass',e);}}
];
var editing=-1,snap=null;
function V(x,i){return '<button type="button" class="v vb" data-edit="'+i+'" title="Clique para editar">'+esc(x)+'</button>';}
function panel(idxs){if(idxs.indexOf(editing)<0)return '';return '<div class="ed"><p class="q" style="font-size:15px">'+steps[editing].t+'</p>'+steps[editing].r()+'<div class="nav" style="margin-top:.5rem"><button type="button" id="ed-cancel">Cancelar</button><button type="button" id="ed-save" class="pri">Salvar</button></div></div>';}
function cancelEdit(){if(snap){Object.keys(snap).forEach(function(k){s[k]=snap[k];});}editing=-1;snap=null;errs={};}
function review(){var k=tokens(s);
return '<p class="q">Tudo pronto. Confira os dados</p><p class="h">Clique em qualquer dado destacado para corrigir. O restante do contrato permanece igual ao modelo.</p><div class="card">'+
'<p><b>Locatário(a):</b> '+V(k.NOME,0)+', Brasileiro inscrito no CPF sob o nº '+V(k.CPF,1)+', residente na '+V(k.END_LOC,2)+'</p>'+panel([0,1,2])+
'<p><b>1. Objeto.</b> Locação do imóvel residencial situado na '+V(k.END_IMO,3)+'</p>'+panel([3])+
'<p><b>2. Prazo.</b> 12 meses, iniciando-se em '+V(k.DIA_INI+' de '+k.MES_INI+' de '+k.ANO_INI,4)+'</p>'+panel([4])+
'<p><b>3. Aluguel.</b> Pago até o dia '+V(k.VENC,5)+' do mês subsequente, no valor de '+V('R$ '+k.VALOR,6)+' ('+V(k.EXT,6)+')</p>'+panel([5,6])+
'<p><b>Assinatura.</b> Cotia, '+V(k.DIA_ASS+' de '+k.MES_ASS+' de '+k.ANO_ASS,7)+'</p>'+panel([7])+'</div>'+
'<div class="nav"><button type="button" id="back">Voltar</button><button type="button" id="gen" class="pri">Baixar contrato (.docx)</button></div><div class="sm" id="msg"></div><div class="nav" style="margin-top:.5rem"><button type="button" id="again" class="lnk">Preencher outro contrato</button></div>';}
function render(focusId){var app=document.getElementById('app');
if(step>=steps.length){app.innerHTML='<div class="bar">'+steps.map(function(){return '<i class="on"></i>';}).join('')+'</div><p class="cap">Revisão final</p>'+review();bind();cpfLive();updExt();var ed=app.querySelector('.ed');var fe=focusId?document.getElementById(focusId):(ed?ed.querySelector('input,select'):null);if(fe)fe.focus();return;}
var st=steps[step],bar=steps.map(function(_,i){return '<i class="'+(i<=step?'on':'')+'"></i>';}).join('');
app.innerHTML='<div class="bar">'+bar+'</div><p class="cap">Pergunta '+(step+1)+' de '+steps.length+'</p><p class="q">'+st.t+'</p><p class="h">'+st.h+'</p>'+st.r()+'<div class="nav"><button type="button" id="back"'+(step===0?' style="visibility:hidden"':'')+'>Voltar</button><button type="button" id="next" class="pri">'+(step===steps.length-1?'Revisar contrato':'Continuar')+'</button></div>';
bind();cpfLive();var el=focusId?document.getElementById(focusId):app.querySelector('input,select');if(el)el.focus();updExt();}
function cpfLive(){var o=document.getElementById('cpflive');if(!o)return;var d=s.cpf.replace(/\D/g,'');if(d.length<11){o.className='sm';o.textContent=d.length?'Digitando… '+d.length+' de 11 números':'';return;}if(cpfOk(s.cpf)){o.className='ok';o.textContent='CPF válido';}else{o.className='err';o.textContent='CPF inválido. Confira os números';}}
function updExt(){var o=document.getElementById('extout');if(o){var t=moneyExt(s.valor);o.textContent=t?'R$ '+money(s.valor)+' — '+t:'';}}
function clr(t,id){if(errs[id]){delete errs[id];var er=t.parentNode.querySelector('.err');if(er)er.remove();}}
function bind(){var app=document.getElementById('app');
app.oninput=function(e){var id=e.target.getAttribute('data-id');if(!id)return;var v=e.target.value;
if(id==='cpf'){v=v.replace(/\D/g,'').slice(0,11).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');e.target.value=v;}
if(id==='l_cep'||id==='i_cep'){v=v.replace(/\D/g,'').slice(0,8).replace(/(\d{5})(\d)/,'$1-$2');e.target.value=v;}
if(id==='l_uf'||id==='i_uf'){v=v.toUpperCase().slice(0,2);e.target.value=v;}
s[id]=v;clr(e.target,id);if(id==='valor')updExt();if(id==='l_cep')lookupCep('l');if(id==='i_cep')lookupCep('i');if(id==='cpf')cpfLive();};
app.onchange=function(e){var id=e.target.getAttribute('data-id');if(id&&e.target.tagName==='SELECT'){s[id]=e.target.value;clr(e.target,id);}};
app.onkeydown=function(e){if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();var n=document.getElementById('next')||document.getElementById('ed-save');if(n)n.click();}};
var nx=document.getElementById('next');if(nx)nx.onclick=function(){var e={};steps[step].v(e);if(Object.keys(e).length){errs=e;var fid=Object.keys(e)[0];render(fid);errs={};return;}errs={};step++;render();};
var bk=document.getElementById('back');if(bk)bk.onclick=function(){if(editing!==-1)cancelEdit();errs={};step=step>=steps.length?steps.length-1:Math.max(0,step-1);render();};
var ca=document.getElementById('copy-addr');if(ca)ca.onclick=function(){errs={};['rua','num','comp','bairro','cidade','uf','cep'].forEach(function(k){s['i_'+k]=s['l_'+k];});render();};
Array.prototype.forEach.call(app.querySelectorAll('[data-edit]'),function(b){b.onclick=function(){var i=+b.getAttribute('data-edit');if(editing===i)return;if(editing!==-1)cancelEdit();snap=JSON.parse(JSON.stringify(s));editing=i;errs={};render();};});
var ec=document.getElementById('ed-cancel');if(ec)ec.onclick=function(){cancelEdit();render();};
var es=document.getElementById('ed-save');if(es)es.onclick=function(){var e={};steps[editing].v(e);if(Object.keys(e).length){errs=e;var fid=Object.keys(e)[0];render(fid);errs={};return;}editing=-1;snap=null;errs={};render();};
var ag=document.getElementById('again');if(ag)ag.onclick=function(){if(confirm('Limpar todas as respostas e começar de novo?')){editing=-1;snap=null;Object.keys(s).forEach(function(k){if(!/^(ini_ano|ass_)/.test(k))s[k]='';});step=0;render();}};
var gn=document.getElementById('gen');if(gn)gn.onclick=function(){var m=document.getElementById('msg');if(editing!==-1){m.textContent='Salve ou cancele a edição aberta antes de baixar.';return;}
buildDocx(s).then(function(blob){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Contrato_Locacao_'+s.nome.trim().split(/\s+/)[0].normalize('NFD').replace(/[^\w]/g,'')+'.docx';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);m.textContent='Arquivo gerado. Confira na pasta de downloads.';}).catch(function(x){m.textContent='Não foi possível gerar o arquivo: '+x.message;});};}
function lockScreen(msg){var app=document.getElementById('app');
if(!window.crypto||!crypto.subtle){app.innerHTML='<p class="q">Conexão não segura</p><p class="h">Abra esta página por um endereço https para liberar o gerador.</p>';return;}
app.innerHTML='<p class="q">Digite a senha</p><p class="h">Os dados do locador ficam cifrados neste arquivo. A senha é pedida só uma vez em cada aparelho.</p><div class="row"><div class="f" style="flex:1 1 0"><label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password"><span class="err" id="pwerr">'+(msg||'')+'</span></div></div><label class="sm" style="display:flex;gap:8px;align-items:center;margin:0 0 12px"><input id="rem" type="checkbox" checked style="width:auto;height:auto"> Lembrar neste aparelho</label><button type="button" id="unl" class="pri">Desbloquear</button>';
var pw=document.getElementById('pw'),b=document.getElementById('unl');pw.focus();
function go(){b.disabled=true;b.textContent='Verificando…';kdf(pw.value,b64(ENC).slice(0,16)).then(unlock).then(function(key){var ok=document.getElementById('rem').checked;return (ok?crypto.subtle.exportKey('raw',key).then(function(r){try{localStorage.setItem('ck',btoa(String.fromCharCode.apply(null,new Uint8Array(r))));}catch(e){}}):Promise.resolve()).then(render);}).catch(function(){lockScreen('Senha incorreta.');});}
b.onclick=go;pw.onkeydown=function(e){if(e.key==='Enter')go();};}
function boot(){var k=null;try{k=localStorage.getItem('ck');}catch(e){}
if(!k||!window.crypto||!crypto.subtle)return lockScreen();
crypto.subtle.importKey('raw',b64(k),'AES-GCM',false,['decrypt']).then(unlock).then(function(){render();}).catch(function(){try{localStorage.removeItem('ck');}catch(e){}lockScreen();});}
document.getElementById('lockbtn').onclick=function(){try{localStorage.removeItem('ck');}catch(e){}location.reload();};
boot();

</script></body></html>
